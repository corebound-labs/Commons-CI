name: .NET Tests

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'Versión del SDK de .NET a instalar (ej. 10.0.x)'
        required: true
        type: string
      solution-path:
        description: 'Ruta del .sln o .csproj a restaurar/compilar/testear'
        required: false
        default: '.'
        type: string
      nuget-feed-url:
        description: 'URL de un feed NuGet privado a agregar antes de restaurar (ej. https://nuget.pkg.github.com/corebound-labs/index.json, ver corebound-labs/Commons). Vacío (default) = no agrega ninguno, comportamiento idéntico al de antes de este input.'
        required: false
        default: ''
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # Requiere que el caller invoque este workflow con `secrets: inherit`
      # (igual que ya hace release.yml) y tenga un secret NUGET_FEED_TOKEN
      # (PAT con scope read:packages) — ver README de corebound-labs/Commons.
      - name: Agregar feed NuGet privado
        if: inputs.nuget-feed-url != ''
        run: dotnet nuget add source "${{ inputs.nuget-feed-url }}" --name private-feed --username github --password "${{ secrets.NUGET_FEED_TOKEN }}" --store-password-in-clear-text

      - name: Restaurar dependencias
        run: dotnet restore "${{ inputs.solution-path }}"

      - name: Compilar
        run: dotnet build "${{ inputs.solution-path }}" --no-restore --configuration Release

      - name: Ejecutar tests
        run: dotnet test "${{ inputs.solution-path }}" --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Publicar resultados de test
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Resultados de tests
          path: './TestResults/*.trx'
          reporter: dotnet-trx
