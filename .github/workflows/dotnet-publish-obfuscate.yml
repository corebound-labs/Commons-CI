name: .NET Publish + Obfuscate JS

# Publica un proyecto .NET y, opcionalmente, ofusca su JS propio — sin saber
# nada del destino final (SmarterASP, Azure, lo que sea). El repo consumidor
# descarga el artifact resultante y hace el deploy con el paso que le
# corresponda a su hosting. Ver Commons-CI#1 (obfuscate-js) y la discusión de
# por qué el deploy en sí no vive aquí: cada app puede publicarse en un sitio
# distinto, y eso cambia con el tiempo.

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'Versión del SDK de .NET a instalar (ej. 10.0.x)'
        required: true
        type: string
      solution-path:
        description: 'Ruta del .sln a restaurar (resuelve también proyectos referenciados)'
        required: true
        type: string
      csproj-path:
        description: 'Ruta del .csproj a publicar'
        required: true
        type: string
      obfuscate-js:
        description: 'true minifica (Terser) y ofusca (javascript-obfuscator) el JS propio tras publicar'
        required: false
        default: true
        type: boolean
      js-path:
        description: 'Ruta del JS propio a ofuscar, relativa a la carpeta publicada (ej. wwwroot/js). Requerido si obfuscate-js es true'
        required: false
        default: ''
        type: string
      js-exclude:
        description: 'Patrones a excluir de la ofuscación, separados por coma'
        required: false
        default: '*.min.js'
        type: string
      obfuscate-rcl-js:
        description: 'true ofusca también el JS de las Razor Class Libraries (ej. UiMetadata.*), publicado por ASP.NET Core bajo wwwroot/_content/<PackageId>/. Sin esto, ese JS queda en claro aunque obfuscate-js sea true'
        required: false
        default: true
        type: boolean
      rcl-js-path:
        description: 'Carpeta donde ASP.NET Core publica los static web assets de las RCL, relativa a la carpeta publicada'
        required: false
        default: 'wwwroot/_content'
        type: string
      artifact-name:
        description: 'Nombre del artifact con el resultado publicado, para descargar en el job de deploy'
        required: false
        default: 'publish'
        type: string
    outputs:
      artifact-name:
        description: 'Nombre del artifact subido (igual al input, por comodidad al encadenar jobs)'
        value: ${{ jobs.publish.outputs.artifact-name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
    # NUGET_GITHUB_ACTOR/NUGET_GITHUB_TOKEN: convención fija con la que
    # nuget.config de un consumidor (ver corebound-labs/EcoTrack) resuelve las
    # credenciales del feed privado de corebound-labs/Commons — sin efecto si
    # el repo no tiene ese feed configurado. Requiere `secrets: inherit` en el
    # caller y un secret NUGET_FEED_TOKEN (PAT read:packages).
    env:
      NUGET_GITHUB_ACTOR: ${{ github.actor }}
      NUGET_GITHUB_TOKEN: ${{ secrets.NUGET_FEED_TOKEN }}

    steps:
      # fetch-depth: 0 (historial + tags completos) — el build de abajo corre
      # `git describe --tags` (ver AppVersion.cs/SetVersionFromGit en el
      # .csproj consumidor) para mostrar la versión real en la app. Con el
      # shallow-clone por defecto (fetch-depth: 1) ese describe no encontraba
      # ningún tag y la app mostraba siempre "1.0.0" en vez de, p.ej.,
      # "1.0.0-263" — el tag SÍ se creaba bien (ver semver-release.yml), solo
      # no llegaba a mostrarse.
      - name: Checkout código (historial completo, para git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restaurar dependencias (solución completa)
        run: dotnet restore "${{ inputs.solution-path }}"

      - name: Publicar (Release)
        run: dotnet publish "${{ inputs.csproj-path }}" -c Release -o "${{ github.workspace }}/publish" --no-restore

      - name: Ofuscar JS propio
        if: inputs.obfuscate-js
        # Ruta completa, no ./.github/... — el checkout de este job es el del
        # repo consumidor (EcoTrack, etc.), no el de Commons-CI, así que una
        # ruta local no resolvería la action.
        uses: corebound-labs/Commons-CI/.github/actions/obfuscate-js@master
        with:
          path: ${{ github.workspace }}/publish/${{ inputs.js-path }}
          exclude: ${{ inputs.js-exclude }}

      - name: Ofuscar JS de las Razor Class Libraries
        if: inputs.obfuscate-js && inputs.obfuscate-rcl-js
        # allow-missing/allow-empty en true: a diferencia del JS propio, esta
        # carpeta es opcional — una app sin RCLs, o cuyas RCLs no traen JS, no
        # debe romper el build por esto.
        uses: corebound-labs/Commons-CI/.github/actions/obfuscate-js@master
        with:
          path: ${{ github.workspace }}/publish/${{ inputs.rcl-js-path }}
          exclude: ${{ inputs.js-exclude }}
          allow-missing: 'true'
          allow-empty: 'true'

      - name: Subir artifact publicado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ github.workspace }}/publish
          retention-days: 1
