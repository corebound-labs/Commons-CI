name: Semantic Version Release

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'Versión del SDK de .NET a instalar (ej. 10.0.x)'
        required: true
        type: string
      csproj-paths:
        description: 'Rutas de los .csproj a versionar, separadas por coma'
        required: true
        type: string
      timezone:
        description: 'Zona horaria con la que se calcula el MMdd del sufijo de versión'
        required: false
        default: 'Europe/Madrid'
        type: string
    outputs:
      new-version:
        description: 'Versión semántica generada (sin el prefijo v)'
        value: ${{ jobs.release.outputs.version }}
      tag-created:
        description: 'true si se creó un tag/release nuevo, false si la versión no cambió'
        value: ${{ jobs.release.outputs.tag-created }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
      tag-created: ${{ steps.check-tag.outputs.exists == 'false' }}
    # NUGET_GITHUB_ACTOR/NUGET_GITHUB_TOKEN: convención fija con la que
    # nuget.config de un consumidor (ver corebound-labs/EcoTrack) resuelve las
    # credenciales del feed privado de corebound-labs/Commons — dotnet build
    # (paso de abajo) restaura implícitamente. Sin efecto si el repo no tiene
    # ese feed configurado. Requiere `secrets: inherit` en el caller y un
    # secret NUGET_FEED_TOKEN (PAT read:packages).
    env:
      NUGET_GITHUB_ACTOR: ${{ github.actor }}
      NUGET_GITHUB_TOKEN: ${{ secrets.NUGET_FEED_TOKEN }}
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el cálculo de versión necesita historial y tags completos

      # Versión propia en vez de GitVersion: no sabe de "build del día" y su increment/next-version
      # dejaban inertes las reglas de feat/fix.
      - name: Calcular versión
        id: gitversion
        env:
          VERSION_TZ: ${{ inputs.timezone }}
        run: |
          set -euo pipefail

          # Reglas: feat -> major, fix -> minor, cualquier otro tipo mantiene el núcleo X.Y.Z.
          # Sufijo: -MMdd.<n>, con n = número de build del día (1, 2, 3...). El punto es necesario:
          # sin él, "1004"+"10" (100410) ordenaría por encima de "1005"+"1" (10051).

          # Un commit que ya lleva tag de versión lo conserva (un re-run no crea un segundo tag).
          existing=$(git tag --points-at HEAD --list 'v[0-9]*' | head -n1 || true)
          if [ -n "$existing" ]; then
            version=${existing#v}
          else
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            if [ -n "$last" ]; then
              core=${last#v}; core=${core%%-*}; range="$last..HEAD"
            else
              core=1.0.0; range="HEAD"
            fi
            IFS=. read -r major minor patch <<< "$core"

            bump=none
            while IFS= read -r subject; do
              case "$subject" in
                feat:*|feat\(*\)*:*|feat!:*) bump=major; break ;;
                fix:*|fix\(*\)*:*|fix!:*) bump=minor ;;
              esac
            done < <(git log --format=%s "$range")

            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
            esac

            day=$(TZ="$VERSION_TZ" date +%m%d)
            n=$(( $(git tag --list "v*-${day}.*" | wc -l) + 1 ))
            version="${major}.${minor}.${patch}-${day}.${n}"
          fi
          echo "Versión calculada: $version"
          echo "semVer=$version" >> "$GITHUB_OUTPUT"

      - name: Comprobar si el tag ya existe
        id: check-tag
        run: |
          if git rev-parse "v${{ steps.gitversion.outputs.semVer }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar .NET
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Actualizar versión en los .csproj
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          IFS=',' read -ra PATHS <<< "${{ inputs.csproj-paths }}"
          for path in "${PATHS[@]}"; do
            dotnet build "$path" /p:Version=${{ steps.gitversion.outputs.semVer }}
          done

      - name: Crear tag
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v${{ steps.gitversion.outputs.semVer }}"
          git push origin "v${{ steps.gitversion.outputs.semVer }}"

      - name: Crear GitHub Release
        if: steps.check-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          generate_release_notes: true
