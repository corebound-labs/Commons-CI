name: .NET Tests

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'Versión del SDK de .NET a instalar (ej. 10.0.x)'
        required: true
        type: string
      solution-path:
        description: 'Ruta del .sln o .csproj a restaurar/compilar/testear'
        required: false
        default: '.'
        type: string
      fail-on-empty-test-report:
        description: 'false tolera una solución sin ningún proyecto de test (ej. un repo de librerías puras, como corebound-labs/Commons) — dotnet test no genera .trx y el paso de reporte, que antes fallaba igual, se omite en vez de marcar el job en rojo. true (default) preserva el comportamiento de siempre: sin .trx es una señal real de que algo se rompió.'
        required: false
        default: true
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    # NUGET_GITHUB_ACTOR/NUGET_GITHUB_TOKEN: convención fija con la que
    # nuget.config de un consumidor (ver corebound-labs/EcoTrack) resuelve las
    # credenciales del feed privado de corebound-labs/Commons — no agregamos
    # ninguna fuente nueva acá (eso ya lo declara el nuget.config del propio
    # repo checkouteado; agregarla de nuevo choca con "source already added").
    # Si el repo no tiene ese feed configurado, estas dos env vars quedan sin
    # uso, sin ningún efecto. Requiere que el caller invoque este workflow con
    # `secrets: inherit` y tenga un secret NUGET_FEED_TOKEN (PAT con scope
    # read:packages) — ver README de corebound-labs/Commons.
    env:
      NUGET_GITHUB_ACTOR: ${{ github.actor }}
      NUGET_GITHUB_TOKEN: ${{ secrets.NUGET_FEED_TOKEN }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restaurar dependencias
        run: dotnet restore "${{ inputs.solution-path }}"

      - name: Compilar
        run: dotnet build "${{ inputs.solution-path }}" --no-restore --configuration Release

      - name: Ejecutar tests
        run: dotnet test "${{ inputs.solution-path }}" --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Publicar resultados de test
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Resultados de tests
          path: './TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-empty: ${{ inputs.fail-on-empty-test-report }}
